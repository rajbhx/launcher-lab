name: Android APK

# All compilation happens here, on GitHub runners. Nothing is built locally.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: Build installable APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (for keytool / apksigner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages
        # The ubuntu runner image already ships a full Android SDK
        # (ANDROID_HOME=/usr/local/lib/android/sdk). We only add what we need.
        # build-tools 33.0.2 is the newest release that still ships the
        # legacy `aapt` binary that cargo-apk 0.10 drives.
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;33.0.2"

      - name: Set up NDK r26d
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Set up Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build APK (release)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo apk build --release

      - name: Locate and verify APK
        run: |
          set -e
          find target -name "*.apk" -print
          APK=$(find target -name "launcher-lab*.apk" | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/33.0.2/aapt2" dump badging "$APK" | head -n 20
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --print-certs "$APK"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-lab-apk
          path: target/**/*.apk
          if-no-files-found: error

      - name: Publish rolling "apk-latest" release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Launcher Lab - latest APK
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Automated build from `main` @ ${{ github.sha }}

            * target: OnePlus 7 (arm64-v8a, minSdk 29, targetSdk 34)
            * debug-signed (installable via "install unknown apps")
            * packages the pure-Rust `cdylib` produced by cargo-apk
          files: target/**/*.apk
