name: Android APK

# All compilation happens here, on GitHub runners. Nothing is built locally.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: Build installable APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (for keytool / apksigner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages
        # The ubuntu runner image already ships a full Android SDK
        # (ANDROID_HOME=/usr/local/lib/android/sdk). We only add what we need.
        # build-tools 33.0.2 is the newest release that still ships the
        # legacy `aapt` binary that cargo-apk 0.10 drives.
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;33.0.2"

      - name: Keep only build-tools 33.0.2
        # cargo-apk selects the lexicographically-highest build-tools directory
        # and needs the legacy `aapt` binary, which newer build-tools no longer
        # ship. Remove the others so 33.0.2 is chosen deterministically.
        run: |
          set -e
          for d in "$ANDROID_HOME"/build-tools/*/; do
            ver=$(basename "$d")
            if [ "$ver" != "33.0.2" ]; then
              echo "removing build-tools $ver"
              sudo rm -rf "$d"
            fi
          done
          ls "$ANDROID_HOME/build-tools"

      - name: Materialize release keystore
        # Stable signing key (same across builds) stored as repo secrets.
        env:
          KEYSTORE_B64: ${{ secrets.LAUNCHER_LAB_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/launcher-lab-release.keystore"
          ls -la "$RUNNER_TEMP/launcher-lab-release.keystore"

      - name: Set up NDK r26d
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Set up Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build APK (release)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/launcher-lab-release.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.LAUNCHER_LAB_KEYSTORE_PASSWORD }}
        # --lib: build only the cdylib artifact. Without it cargo-apk also tries
        # to package the desktop bin target and panics ("Bin is not compatible
        # with Cdylib") when resolving its library path.
        run: cargo apk build --release --lib

      - name: Locate and verify APK
        run: |
          set -e
          find target -name "*.apk" -print
          APK=target/release/apk/launcher-lab.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/33.0.2/aapt2" dump badging "$APK" | head -n 20
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-lab-apk
          path: target/release/apk/launcher-lab.apk
          if-no-files-found: error

      - name: Publish rolling "apk-latest" release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Launcher Lab - latest APK
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Automated build from `main` @ ${{ github.sha }}

            * target: OnePlus 7 (arm64-v8a, minSdk 29, targetSdk 34)
            * signed with the project release key (stable across builds)
            * packages the pure-Rust `cdylib` produced by cargo-apk
          files: target/release/apk/launcher-lab.apk
